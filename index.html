<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Eyes Follow</title>
<style>
  html, body { margin: 0; height: 100%; background: #1b1716; overflow: hidden; touch-action: none; }
  /* 隙間なしで画面いっぱいにタイル状に敷き詰める（はみ出した分は切る） */
  #grid { position: absolute; inset: 0; display: grid; overflow: hidden; }
  .eye { background-repeat: no-repeat; }
  /* ---- トップページ（ほかの試作と同じ、白い紙に1pxの黒線のシート） ---- */
  #intro { position: fixed; inset: 0; overflow-y: auto; touch-action: pan-y; background: #fff; color: #111; z-index: 2;
           padding: calc(env(safe-area-inset-top, 0px) + 12px) 12px calc(env(safe-area-inset-bottom, 0px) + 12px);
           font: 500 15px/1.3 "Helvetica Neue", Helvetica, Arial, system-ui, sans-serif; letter-spacing: -.01em;
           -webkit-user-select: none; user-select: none; }
  #intro.hide { display: none; }
  .sheet { box-sizing: border-box; min-height: 100%; display: flex; flex-direction: column; gap: 18px;
           border: 1px solid #111; border-radius: 22px; padding: 16px 18px 18px; }
  .meta { display: flex; justify-content: space-between; gap: 12px; font-size: 12px; font-weight: 700; }
  .sheet h1 { margin: auto 0 0; font-size: 60px; line-height: .88; font-weight: 700; letter-spacing: -.045em; }
  .diagram { display: block; width: 100%; height: auto; overflow: visible; }
  .diagram text { font: 700 11px "Helvetica Neue", Helvetica, Arial, sans-serif; fill: #111; }
  .sheet p { margin: 0; max-width: 30em; }
  #go { font: inherit; color: #111; background: #fff; cursor: pointer; touch-action: manipulation;
        border: 1px solid #111; border-radius: 999px; min-height: 60px; padding: 0 22px;
        display: flex; justify-content: space-between; align-items: center; font-size: 18px; font-weight: 700; letter-spacing: -.02em; }
  #go:active { background: #111; color: #fff; }
  .sheet .foot { margin-top: auto; padding-top: 12px; border-top: 1px dashed #111; }
</style>
</head>
<body>
<div id="grid"></div>
<div id="intro">
  <div class="sheet">
    <div class="meta"><span>Prototype</span><span>Gaze / Touch</span></div>
    <h1>Eyes<br>Follow.</h1>
    <svg class="diagram" viewBox="0 0 320 130" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1">
      <!-- 敷き詰めた目が、右下の指のほうを一斉に見る -->
      <path d="M14 34 Q50 8 86 34 Q50 58 14 34 Z" /><circle cx="60" cy="38" r="9" /><circle cx="60" cy="38" r="3" fill="currentColor" stroke="none" />
      <path d="M104 34 Q140 8 176 34 Q140 58 104 34 Z" /><circle cx="152" cy="39" r="9" /><circle cx="152" cy="39" r="3" fill="currentColor" stroke="none" />
      <path d="M14 84 Q50 58 86 84 Q50 108 14 84 Z" /><circle cx="63" cy="86" r="9" /><circle cx="63" cy="86" r="3" fill="currentColor" stroke="none" />
      <path d="M104 84 Q140 58 176 84 Q140 108 104 84 Z" /><circle cx="157" cy="87" r="9" /><circle cx="157" cy="87" r="3" fill="currentColor" stroke="none" />
      <path d="M62 38 L262 98 M154 39 L262 98 M65 86 L262 98 M159 87 L262 98" stroke-dasharray="2 3" />
      <circle cx="268" cy="100" r="11" /><circle cx="268" cy="100" r="1.5" fill="currentColor" stroke="none" />
      <text x="268" y="126" text-anchor="middle" stroke="none">your finger</text>
      <text x="95" y="124" text-anchor="middle" stroke="none">every eye looks</text>
    </svg>
    <p>A wall of eyes, tiled edge to edge. Touch or drag anywhere and every eye turns to look at your finger. Let go and they wander, blinking now and then.</p>
    <button id="go"><span>Start</span><span aria-hidden="true">&rarr;</span></button>
    <div class="meta foot"><span>49 gaze cells + 3 blink frames</span><span>No camera</span></div>
  </div>
</div>
<script>
// スプライト: sprites/{open,b1,b2,b3}.jpg、それぞれ 7×7 マス（行=上→下の視線、列=左→右の視線）
const SHEETS = ["open", "b1", "b2", "b3"];
const BLINK = [0, 1, 2, 3, 3, 2, 1, 0];        // まばたき1回のコマ（シート番号）
const BLINK_MS = 45;
const YAW = 35, PITCH = 25;                    // 仮動画の振り幅（度）。7×7 の端がこの角度
const grid = document.getElementById("grid");
SHEETS.forEach(s => { const i = new Image(); i.src = `sprites/${s}.jpg`; });

let eyes = [];
function layout() {
  const w = innerWidth, h = innerHeight;
  const cols = 5;
  const ew = Math.ceil(w / cols / 3) * 3, eh = ew * 2 / 3;   // 整数ピクセルにして、隣のマスがにじまないようにする
  const rows = Math.ceil(h / eh);
  grid.style.gridTemplateColumns = `repeat(${cols}, ${ew}px)`;
  grid.style.gridAutoRows = `${eh}px`;
  grid.innerHTML = "";
  eyes = [];
  for (let i = 0; i < cols * rows; i++) {
    const el = document.createElement("div");
    el.className = "eye";
    el.style.backgroundSize = `${ew * 7}px ${eh * 7}px`;
    grid.appendChild(el);
    eyes.push({ el, ew, eh, r: 3, c: 3, sheet: -1, blink: -1, next: performance.now() + 1000 + Math.random() * 4000 });
  }
}

// トップページ：Start を押すまで目の画面は裏で動かしておき、押したら閉じる
const intro = document.getElementById("intro");
document.getElementById("go").addEventListener("click", e => {
  e.stopPropagation(); intro.classList.add("hide");
  // iPhone は、ボタンを押したときに動きセンサーの許可を求める必要がある
  const DM = window.DeviceMotionEvent;
  if (DM && typeof DM.requestPermission === "function") DM.requestPermission().then(s => { if (s === "granted") listenShake(); }).catch(() => {});
  else listenShake();
});

// スマホを振ると、全部の目が同時に閉じて、ゆっくり開く
const SHUT_CLOSE = 30, SHUT_HOLD = 130, SHUT_OPEN = 400;    // 閉じる・閉じたまま・開く（ミリ秒）
const FRONT_HOLD = 400, FRONT_JITTER = 600;               // 開いたあと正面を向いている時間と、目ごとのばらつき（ミリ秒）
const SHAKE = 18;                                          // これより強い揺れの変化（m/s²）で反応
let shutStart = -1e9, lastAcc = null;
function listenShake() {
  if (listenShake.on) return; listenShake.on = true;
  addEventListener("devicemotion", ev => {
    const a = ev.accelerationIncludingGravity; if (!a || a.x == null) return;
    if (lastAcc) {
      const d = Math.abs(a.x - lastAcc.x) + Math.abs(a.y - lastAcc.y) + Math.abs(a.z - lastAcc.z);
      const now = performance.now();
      if (d > SHAKE && now - shutStart > SHUT_CLOSE + SHUT_HOLD + SHUT_OPEN) {
        shutStart = now;
        for (const eye of eyes) eye.frontUntil = now + SHUT_CLOSE + SHUT_HOLD + SHUT_OPEN + FRONT_HOLD + Math.random() * FRONT_JITTER;
      }
    }
    lastAcc = { x: a.x, y: a.y, z: a.z };
  });
}
function shutSheet(t) {   // 振った後のコマ（-1 は振っていないとき）
  const s = t - shutStart;
  if (s < 0 || s >= SHUT_CLOSE + SHUT_HOLD + SHUT_OPEN) return -1;
  if (s < SHUT_CLOSE) return 1 + Math.floor(s / SHUT_CLOSE * 3);
  if (s < SHUT_CLOSE + SHUT_HOLD) return 3;
  return 3 - Math.floor((s - SHUT_CLOSE - SHUT_HOLD) / SHUT_OPEN * 3);
}

let target = null, lastMove = 0;
function setTarget(x, y) { target = { x, y }; lastMove = performance.now(); }
addEventListener("pointermove", e => setTarget(e.clientX, e.clientY));
// タップした位置から波紋のように、近い目から順にまばたきする
const RIPPLE = 0.9;                              // 波紋の速さ（px/ミリ秒）
addEventListener("pointerdown", e => {
  setTarget(e.clientX, e.clientY);
  if (!intro.classList.contains("hide")) return;  // トップページのタップでは起こさない
  const now = performance.now();
  for (const eye of eyes) {
    const r = eye.el.getBoundingClientRect();
    eye.rippleAt = now + Math.hypot(e.clientX - (r.left + r.width / 2), e.clientY - (r.top + r.height / 2)) / RIPPLE;
  }
});

function draw(e, sheet) {
  if (sheet !== e.sheet) { e.el.style.backgroundImage = `url(sprites/${SHEETS[sheet]}.jpg)`; e.sheet = sheet; }
  e.el.style.backgroundPosition = `${-e.c * e.ew}px ${-e.r * e.eh}px`;
}

function tick(t) {
  // 触っていない間は、ゆっくり見回す
  let tx, ty;
  if (target && t - lastMove < 3000) { tx = target.x; ty = target.y; }
  else { tx = innerWidth * (0.5 + 0.45 * Math.sin(t / 1700)); ty = innerHeight * (0.5 + 0.4 * Math.sin(t / 2300)); }
  // 目から見た相手（指）までの距離。近いほど、隣の目でも大きく向きが変わる
  const depth = Math.max(innerWidth, innerHeight) * 0.22;
  const dt = Math.min(100, t - (tick.last || t)); tick.last = t;
  const k = 1 - Math.exp(-dt / 70);              // 目は約0.1秒かけて向きを変える（途中のマスも通る）
  for (const e of eyes) {
    const b = e.el.getBoundingClientRect();
    const dx = tx - (b.left + b.width / 2), dy = ty - (b.top + b.height / 2);
    const yaw = Math.atan2(dx, depth) * 180 / Math.PI, pitch = -Math.atan2(dy, depth) * 180 / Math.PI;
    if (e.yaw === undefined) { e.yaw = yaw; e.pitch = pitch; }
    e.yaw += (yaw - e.yaw) * k; e.pitch += (pitch - e.pitch) * k;
    if (t < (e.frontUntil || 0)) { e.yaw = 0; e.pitch = 0; }   // 振ったあとは真正面（列3・真ん中の段）で画面と目が合う状態で開き、目ごとにばらばらの時間で動き出す
    e.c = Math.max(0, Math.min(6, Math.round(3 + e.yaw / YAW * 3)));
    e.r = Math.max(0, Math.min(6, Math.round(3 - e.pitch / PITCH * 3)));
    if (e.rippleAt && t >= e.rippleAt) { e.blink = 0; e.blinkStart = t; e.rippleAt = 0; }
    else if (e.blink < 0 && t > e.next) { e.blink = 0; e.blinkStart = t; }
    let sheet = 0;
    const shut = shutSheet(t);
    if (shut >= 0) { e.blink = -1; e.rippleAt = 0; e.next = t + 1500 + Math.random() * 4000; sheet = shut; }
    else if (e.blink >= 0) {
      const k = Math.floor((t - e.blinkStart) / BLINK_MS);
      if (k >= BLINK.length) { e.blink = -1; e.next = t + 2000 + Math.random() * 5000; }
      else sheet = BLINK[k];
    }
    draw(e, sheet);
  }
  requestAnimationFrame(tick);
}
addEventListener("resize", layout);
layout();
requestAnimationFrame(tick);
</script>
</body>
</html>
